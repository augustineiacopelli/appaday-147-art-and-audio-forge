.backlink { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-weight: 700; font-size: .9rem; text-decoration: none; white-space: nowrap; }
.backlink:hover { text-decoration: underline; }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
  background: color-mix(in srgb, var(--bg2) 80%, transparent); border-bottom: 1px solid var(--line);
}
.btn.proj-title {
  flex: 1 1 150px; min-width: 0; justify-content: flex-start; font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: .03em;
}

.tabs {
  display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line);
  scrollbar-width: none; background: color-mix(in srgb, var(--bg) 60%, transparent);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 14px; border: 0; background: none;
  color: var(--ink2); font: inherit; font-weight: 700; letter-spacing: .03em; cursor: pointer; white-space: nowrap;
  border-bottom: 3px solid transparent; flex: none;
}

.ws { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.ws-inner { padding: 16px; max-width: 1200px; margin: 0 auto; }
.app-foot {
  display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 12px;
  border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted);
}

/* Components */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.panel + .panel { margin-top: 14px; }
.panel-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; margin: 0 0 6px; color: var(--ink); }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; min-width: 0; }
.grid-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); color: var(--ink);
  font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); background: transparent; }
.btn-danger.solid { background: var(--danger); color: #fff; }
.btn-icon { padding: 0; width: 44px; }
.btn .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: kspin .8s linear infinite; }
@keyframes kspin { to { transform: rotate(360deg); } }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor;
  font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; line-height: 1.5;
}
.chip-error { color: var(--danger); }
.chip-broken { color: var(--broken); }
.chip-forward { color: var(--fwd); }
.chip-warning { color: var(--warn); }
.chip-ok { color: var(--ok); }
.chip-muted { color: var(--muted); }
.chip-accent { color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.field-label .req { color: var(--accent); }
.field-help { font-size: .82rem; color: var(--muted); }
.field-msg:empty { display: none; }
.field-msg { display: flex; flex-direction: column; gap: 2px; font-size: .84rem; }
.msg { display: flex; gap: 6px; align-items: baseline; }
.msg-error { color: var(--danger); } .msg-broken { color: var(--broken); } .msg-forward { color: var(--fwd); } .msg-warning { color: var(--warn); }
.field.has-error > .field-body .inp, .field.has-error > .field-body .ref-btn { border-color: var(--danger); }
.inp {
  width: 100%; min-height: 44px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line2);
  background: var(--bg2); color: var(--ink); font: inherit; font-size: 1rem;
}
.inp::placeholder { color: var(--muted); opacity: .8; }
textarea.inp { resize: vertical; min-height: 88px; line-height: 1.45; }
textarea.inp.mono { font-family: var(--font-mono); font-size: .9rem; min-height: 64px; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 12px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; }
.switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 48px; height: 28px; border-radius: 999px; background: var(--line2); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(20px); background: var(--accent-ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.color-row { display: flex; gap: 8px; align-items: center; }
.color-row input[type="color"] { width: 44px; height: 44px; padding: 2px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg2); cursor: pointer; flex: none; }
.form-grid { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.span-all { grid-column: 1 / -1; }
.kform-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.kform-type { font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; }
.kform-head .field-msg { flex-basis: 100%; }
code.id { color: var(--muted); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.ref-row { display: flex; gap: 6px; min-width: 0; }
.ref-btn {
  flex: 1; min-width: 0; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; text-align: left;
  padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg2); color: var(--ink); font: inherit; cursor: pointer;
}

.klist { display: flex; flex-direction: column; gap: 8px; }
.klist-item { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 8px 10px 10px; background: color-mix(in srgb, var(--panel2) 60%, transparent); min-width: 0; }
.klist-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.klist-num { font-weight: 800; color: var(--accent); font-size: .85rem; letter-spacing: .08em; }
.klist-ctrls { display: flex; gap: 2px; }
.reflist-row { display: flex; gap: 4px; align-items: center; min-width: 0; }
.fieldset { border: 1px dashed var(--line2); border-radius: var(--radius-sm); padding: 10px; }
.empty-line { color: var(--muted); font-style: italic; font-size: .92rem; padding: 4px 2px; }
.tbl-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl thead th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); background: var(--panel2); }
.tbl tbody tr:last-child td, .tbl tbody tr:last-child th { border-bottom: 0; }
.tbl-edit td { padding: 4px; }
.tbl-edit .inp { min-width: 84px; }
.tbl-edit th small { display: block; color: var(--muted); font-weight: 400; font-family: var(--font-mono); font-size: .72rem; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 12px; animation: kfade .12s ease-out; }
@keyframes kfade { from { opacity: 0; } to { opacity: 1; } }
.dialog {
  width: min(560px, 100%); max-height: calc(100dvh - 24px); display: flex; flex-direction: column;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line2); border-radius: var(--radius); box-shadow: var(--shadow);
}
.dialog.wide { width: min(820px, 100%); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.dlg-title { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .04em; }
.dlg-body { padding: 16px; overflow-y: auto; min-height: 0; }
.dlg-body > p:first-child { margin-top: 0; }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.overlay.drawer-overlay { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer {
  width: min(580px, 100vw); height: 100dvh; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line2);
  box-shadow: var(--shadow); animation: kslide .18s ease-out;
}
@keyframes kslide { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer .dlg-body { flex: 1; }
.toast-root { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(460px, calc(100vw - 24px)); pointer-events: none; }
.toast {
  pointer-events: auto; padding: 10px 14px; border-radius: 10px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2);
  border-left: 4px solid var(--accent2); box-shadow: var(--shadow); font-weight: 500; animation: kfade .15s;
}
.toast.error { border-left-color: var(--danger); } .toast.warn { border-left-color: var(--warn); } .toast.ok { border-left-color: var(--ok); }
.busy { position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: flex; align-items: center; justify-content: center; }
.busy-card { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); box-shadow: var(--shadow); font-weight: 700; }
.busy-card .spin { width: 22px; height: 22px; border: 3px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: kspin .8s linear infinite; }
.pick-search { margin-bottom: 10px; }
.pick-list { display: flex; flex-direction: column; gap: 4px; }
.pick-item { justify-content: space-between; flex-wrap: wrap; text-align: left; height: auto; padding: 8px 12px; }
.pick-item[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ai-wrap { display: inline-flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ai-hint { font-size: .85rem; color: var(--warn); }
.ai-hint button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; min-height: 44px; min-width: 44px; }

/* Validation panel, review, stubs */
.vgroup { border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 10px; overflow: hidden; }
.vgroup-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 6px 6px 12px; background: var(--panel2); }
.vgroup-head strong { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.vitem { display: flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-top: 1px solid var(--line); font-size: .92rem; flex-wrap: wrap; }
.vitem code { color: var(--muted); }
.vsummary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.section-h { font-family: var(--font-display); font-size: .95rem; letter-spacing: .06em; margin: 16px 0 8px; color: var(--ink2); }
.review-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; background: var(--panel2); }
.review-card.ok { border-left: 3px solid var(--ok); } .review-card.bad { border-left: 3px solid var(--danger); }
.review-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.review-title strong { font-size: 1.05rem; }
.review-issues { margin: 6px 0 8px; padding: 0; list-style: none; font-size: .88rem; }
.review-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line2); }
.stub { text-align: center; padding: 36px 18px; }
.stub-glyph { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.stub-glyph svg.ico { width: 30px; height: 30px; }
.stub h2 { font-family: var(--font-display); letter-spacing: .05em; margin: 0 0 6px; }
.stub p { max-width: 560px; margin: 6px auto; color: var(--ink2); }
.slot-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--panel2); }
.slot-info { min-width: 0; flex: 1 1 180px; }
.slot-info strong { display: block; overflow-wrap: anywhere; }
.slot-info small { color: var(--muted); }
.radio-cards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin: 10px 0; }
.radio-card { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line2); border-radius: var(--radius-sm); cursor: pointer; min-height: 44px; }
.radio-card input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.radio-card.disabled { opacity: .55; cursor: not-allowed; }
.settings-test { font-size: .9rem; min-height: 1.4em; }
.settings-test.ok { color: var(--ok); } .settings-test.bad { color: var(--danger); }

@media (max-width: 600px) {
  body { font-size: 16px; }
  .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .top-actions .btn { padding: 0; width: 44px; }
  .brand-num { display: none; }
  .ws-inner { padding: 12px; }
  .panel { padding: 12px; }
  .dlg-body { padding: 12px; }
}
@media (max-width: 380px) {
  .brand-title { font-size: 1.1rem; letter-spacing: .05em; }
  .backlink { padding: 0 4px; font-size: .82rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.welcome { margin: 12px 16px 0; padding: 16px; border: 1px solid var(--line2); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-sm); }
.welcome[hidden] { display: none; }
.welcome h2 { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: .04em; margin: 0 0 4px; color: var(--accent); }
.welcome p { margin: 0 0 10px; color: var(--ink2); }
.welcome-stages { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); margin: 0 0 12px; padding: 0; list-style: none; counter-reset: stage; }

.welcome-stages li { counter-increment: stage; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg2); padding: 10px 12px; min-width: 0; }
.welcome-stages li::before { content: 'Stage ' counter(stage); display: block; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.welcome-stages strong { display: block; font-family: var(--font-display); font-size: 1rem; margin: 2px 0 4px; }
.welcome-stages span { font-size: .92rem; color: var(--ink2); }
.welcome .btn-row { margin-top: 2px; }
.foot-link { min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
/* === KIT:CORE CSS END === */
/* === ART:SHELL CSS BEGIN === */
.size-btn { padding: 0 8px; }
.size-btn .chip { pointer-events: none; }
.store-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: color-mix(in srgb, var(--danger) 16%, var(--bg2)); border-bottom: 1px solid var(--danger); color: var(--ink); font-weight: 700; }
.store-banner[hidden] { display: none; }
.store-banner span { flex: 1 1 240px; min-width: 0; }
.a7-hero .btn-row { margin-top: 10px; }
.a7-grid { margin-top: 14px; margin-bottom: 14px; }
.a7-grid .card .section-h { margin-top: 0; }
.a7-prefixes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.a7-meter { height: 14px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--line2); overflow: hidden; margin: 4px 0 8px; }
.a7-meter i { display: block; height: 100%; background: var(--ok); }

.brand-title { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 520px) { .brand-title { font-size: 1.02rem; letter-spacing: .03em; } .brand-num { display: none; } }
/* === ART:SHELL CSS END === */
/* === ART:PALETTE CSS BEGIN === */
.a7-sub { display: flex; gap: 2px; overflow-x: auto; margin: 0 0 14px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.a7-sub::-webkit-scrollbar { display: none; }

.a7-sub button:hover { color: var(--ink); }

.a7-sw:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }

.a7-sw .n { position: absolute; left: 4px; bottom: 2px; font: 600 11px/1 var(--font-mono); pointer-events: none; }
.a7-strip { display: flex; height: 22px; margin-top: 6px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line2); max-width: 420px; }

.a7-strip i.a7-clear, .a7-clear { background: repeating-conic-gradient(#8a8a8a 0 25%, #c4c4c4 0 50%) 0 0 / 8px 8px; }
.a7-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); }
.a7-row:last-child { border-bottom: 0; }
.a7-row.a7-hit { background: var(--accent-soft); border-radius: var(--radius-sm); padding-left: 8px; padding-right: 8px; }
.a7-grow { flex: 1 1 200px; min-width: 0; }
.a7-name { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.a7-small { font-size: .88rem; }
.a7-fig { flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 4px; box-sizing: content-box; }

  // from two pieces so that no literal marker string appears anywhere except on the two fence lines themselves.
  Kit.engine = (function () {
    var OPEN = '// === ENGINE:BATTLE' + ' BEGIN ===', CLOSE = '// === ENGINE:BATTLE' + ' END ===';
    var cache = null;
    function pageScript() {
      var list = document.getElementsByTagName('script'), i, t;
      for (i = 0; i < list.length; i++) {
        t = list[i].textContent || '';

      }
      return '';
    }
    return {
      OPEN: OPEN, CLOSE: CLOSE,
      // The exact text between the two marker lines ('' when the page source cannot be read).
      source: function () {
        if (cache) return cache;
        var t = pageScript(), a = t.indexOf(OPEN), z = t.indexOf(CLOSE, a + 1);
        if (a < 0 || z < 0) return '';
        a = t.indexOf('\n', a);

        if (a < 0 || z < a) return '';

 *
 * API: ENGINE_BATTLE = { version, templates, evalExpr, gaugeMax (65536), schedulers ['atb','rounds','conditional'],

 *     opts = { waitMode, scheduler, tickCap (20000), attackPower, damageCap, limitRate, events, noDamageLog }.
 *   advance(state, input) -> { state, events, awaiting }. Never mutates its input (deep clones via JSON).
 *     input: null runs to the next decision (can be a whole foe turn or several), {type:'step', ticks:n},
 *     {type:'command', actor, abl, target | targets}, {type:'flee', actor}.
 *   suggest(state, policy) -> the default party policy's input for state.awaiting.actor.
 *   replay(data, seed, opts, [{t, input}]) -> { state, events, awaiting }.  run(data, seed, policy, opts) -> { events, result }.
 *
 * Snapshot (init state) keys: v seed rng{a,calls} t turns sched progression waitMode tickCap gaugeMax db units readyQueue
 *   awaiting round preemptive result res damageLog lastAttacker noLog.  About 10 KB for a 3 v 2 battle.
 *   db: abl attack attackPower damageCap elements fx gmb inverts limitRate relations roles sta stats troop warnings weather
 *     weatherId.  db.abl[id] = {id,name,kind,element,power,cost{mp},chargeTicks,targeting{side,scope},statusEffects,fx,revive};
 *     the built in attack is id '_attack' (db.attack).  db.troop = {id, name, noEscape, preemptive}.
 *   unit (both sides): uid ('p0'..'pN' party, 'e0'..'eN' foes, in data order), side 'party'|'foe', ref (chr_ or enm_ id),
 *     name (repeated foe names get ' A', ' B' suffixes), level, row 'front'|'back', stats{}, maxHp maxMp hp mp gauge fill
 *     ready charging{abl,targets,left}|null statuses[{sta,left}] ko turns kills affinity{} tax mods{} addedEffects
 *     attackElement counter commands limits limit{gauge,level,uses,usesAtLevel,kills}|null gambit nextAt frozenTicks limitFlag.
 *   party unit adds: weaponClass statMods supports.  foe unit adds: fam tier palette{base,accent} isBoss gil exp ap.
 *   state.awaiting = { actor, commands:[{key,label,abls:[{id,name,mp,ok,side,scope,element,kind}]}], targets:{foe:[],party:[]} }.
 *
 * Events: every event is { type, t, actor, target, value, element, crit } plus abl, name, targets where useful.
 *   tick       value = ticks advanced. One per advance call that moved time. Carries NO gauge values.
 *   ready      actor.
 *   command    actor, abl, name, targets; value 'flee' for a flee attempt.
 *   action     actor, abl, name, element, targets; value 'counter' when it is a counter. No MP cost field.
 *   damage     actor (null for status ticks), target, value (already clamped), element, crit, abl.

  // ---------------------------------------------------------------- shared palette editor (local and tier)
  function openEditor(rid, repaintList) {

      body: function (body, h) {
        function paint() {
          var r = ART.records.get(rid, b), entries = P.entries(b);
          U.clear(body);
          if (!r) { body.appendChild(el('div', 'empty-line', 'This palette no longer exists.')); return; }
          h.setTitle(r.name);

          var head = el('div', 'a7-edhead');
          head.appendChild(figure(tier ? BLOB : DOLL, r.slots, entries, r.colorway && r.colorway.accent, 6));
          var meta = el('div', 'a7-grow');
          meta.innerHTML = '<dl class="kv"><dt>Record</dt><dd><code class="id">' + esc(r.id) + '</code></dd><dt>For</dt><dd>' + esc(subjectLabel(r)) + '</dd><dt>Origin</dt><dd>' + originChip(r) + '</dd></dl>';

              } }));
            });
            row.appendChild(st);
            body.appendChild(row);

  function nameOf(id) {

  var VIEWS = { master: viewMaster, colorways: viewColorways, tiers: viewTiers, elements: viewElements };
  function render(host) {
    var head = el('section', 'panel');
    head.innerHTML = '<h2 class="panel-title">Palette</h2><p class="muted">The master palette every sprite, tile, and effect is drawn from, with the colorways, tier palettes, and element palettes fitted to it.</p>';
    host.appendChild(head);
    var tabs = el('div', 'a7-sub'); tabs.setAttribute('role', 'tablist'); tabs.setAttribute('aria-label', 'Palette sections');
    var panel = el('div', 'a7-subpanel'); panel.setAttribute('role', 'tabpanel');
    SUBS.forEach(function (s) {
      var t = el('button', null, esc(s[1])); t.type = 'button'; t.setAttribute('role', 'tab'); t.dataset.sub = s[0];
      t.addEventListener('click', function () { ui.sub = s[0]; ui.focus = null; paint(); });
      tabs.appendChild(t);
    });

          '<label class="radio-card' + (blocked ? ' disabled' : '') + '"><input type="radio" name="a7Status" value="final"' + (blocked ? ' disabled' : '') + '><span><strong>Final</strong><br><span class="muted">' + (blocked ? 'Blocked until errors are fixed and every forward field resolves.' : 'Opens the art namespace and marks forge 147 final.') + '</span></span></label>';
        body.appendChild(rc);
        Array.prototype.forEach.call(rc.querySelectorAll('input'), function (r) { r.addEventListener('change', function () { status = r.value; }); });
      },
      actions: [
        { label: 'Close', kind: 'ghost', value: null },
        { label: 'Download bundle and manifest', kind: 'primary', icon: 'export', onClick: function () {
          try {
            var out = Kit.buildExport(status);
            out.files.forEach(function (f, i) { setTimeout(function () { U.download(f.name, f.text, f.mime); }, i * 350); });
            Kit.ui.toast('Exported (' + status + '). Hash ' + out.hash.slice(0, 12) + '.', 'ok', 6000);
          } catch (e) { Kit.ui.toast(e.message, 'error', 7000); return false; }
        } }
      ]
    });
  };

  // ---------------------------------------------------------------- Quick Build
  function qbSummary(rep) {
    return Object.keys(rep.steps).map(function (k) { var s = rep.steps[k]; return k + ' ' + s.created + ' new, ' + s.refreshed + ' refreshed, ' + s.kept + ' kept'; }).join('; ');
  }
  ART.qbSummary = qbSummary;
  ART.openQuickBuild = function () {
    var b = cur();
    if (ready(b) !== true) { Kit.ui.toast(ready(b), 'warn'); return; }
    var go = ART.isEmpty(b) ? Promise.resolve(true) : Kit.ui.confirm({ title: 'Run Quick Build?', message: 'Quick Build fills every missing art record from the bundle and refreshes the generated ones. Records you edited, or accepted from Claude, are kept exactly as they are.', okLabel: 'Run Quick Build' });
    go.then(function (ok) {
      if (!ok) return;
      var rep;
      try { rep = ART.quickBuild.run(b); } catch (e) { console.error(e); Kit.ui.toast('Quick Build failed: ' + e.message, 'error', 8000); return; }
      Kit.refreshValidation();
      Kit.rerender();
      Kit.ui.toast('Quick Build done in ' + rep.ms + ' ms: ' + rep.created + ' new, ' + rep.refreshed + ' refreshed, ' + rep.kept + ' kept.', 'ok', 6000);
    });
  };

  // ---------------------------------------------------------------- Start
  function kv(pairs) { return '<dl class="kv">' + pairs.map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + p[1] + '</dd>'; }).join('') + '</dl>'; }
  function loadDemo() {
    var go = ART.isEmpty() && !(cur().charter && cur().charter.locked) ? Promise.resolve(true) :
      Kit.ui.confirm({ title: 'Load the demo bundle?', message: 'The current working draft will be replaced by the demo. Save it to a slot or export it first if you want to keep it.', okLabel: 'Load demo' });
    go.then(function (ok) { if (!ok) return; Kit.bundle.load(ART_DEMO.bundle()); Kit.ui.toast('Demo bundle loaded.', 'ok'); });
  }
  // Copies Day 146's working draft into this forge. Day 146's copy is never written or removed.
  function openDay146Draft() {
    var d = ART.storage.day146Draft();
    if (!d) { Kit.ui.toast('Day 146 has no draft in this browser.', 'warn'); return; }
    var go = ART.isEmpty() && !(cur().charter && cur().charter.locked) ? Promise.resolve(true) :
      Kit.ui.confirm({ title: 'Open the Day 146 draft?', message: 'This forge\'s current draft will be replaced by a copy of ' + ((d.kit && d.kit.title) || 'the Day 146 draft') + '. Save it to a slot or export it first if you want to keep it.', okLabel: 'Open Day 146 draft' });
    go.then(function (ok) {
      if (!ok) return;
      try { Kit.bundle.load(d); Kit.ui.toast('Opened a copy of the Day 146 draft.', 'ok'); } catch (e) { Kit.ui.toast(e.message, 'error', 7000); }
    });
  }
  ART.openDay146Draft = openDay146Draft;
  function renderStart(host) {
    var b = cur(), C = b.charter || {}, S = C.sections || {}, sp = C.specs || {};
    var head = el('section', 'panel a7-hero');
    head.innerHTML = '<h2 class="panel-title">Start</h2><p class="muted">Load a Day 146 bundle or the demo. Art and Audio Forge reads the Charter and Rules, writes only the art namespace and eight reserved forward fields, and exports a bundle Day 146 still opens.</p>';
    var row = el('div', 'btn-row');
    var imp = el('button', 'btn btn-primary', Kit.icon('import') + '<span>Load a Day 146 bundle</span>'); imp.type = 'button';
    imp.addEventListener('click', function () { var f = document.getElementById('fileImport'); f.value = ''; f.click(); });
    var demo = el('button', 'btn', Kit.icon('spark') + '<span>Load the demo</span>'); demo.type = 'button'; demo.addEventListener('click', loadDemo);
    var qb = el('button', 'btn', Kit.icon('spark') + '<span>Quick Build</span>'); qb.type = 'button';
    if (ready(b) !== true) { qb.disabled = true; qb.title = ready(b); } else qb.addEventListener('click', ART.openQuickBuild);
    var st = el('button', 'btn btn-ghost', Kit.icon('gear') + '<span>Settings</span>'); st.type = 'button'; st.addEventListener('click', Kit.settings.open);
    row.appendChild(imp); row.appendChild(demo); row.appendChild(qb);
    var d146 = ART.storage.day146Draft();
    if (d146 && d146.kit && d146.kit.bundleId !== b.kit.bundleId) {
      var od = el('button', 'btn', Kit.icon('book') + '<span>Open the Day 146 draft</span>'); od.type = 'button';
      od.title = 'Copy the draft Saga Forge left in this browser (' + ((d146.kit && d146.kit.title) || 'untitled') + ') into this forge';
      od.addEventListener('click', openDay146Draft);
      row.appendChild(od);
    }
    row.appendChild(st);
    head.appendChild(row);
    host.appendChild(head);

    var grid = el('div', 'grid-cards a7-grid');
    host.appendChild(grid);
    var proj = el('section', 'card');
    var ok = ready(b) === true;
    var res = sp.resolution || {};
    proj.innerHTML = '<h3 class="section-h">Project</h3>' + (ok ? '' : '<p class="msg msg-warning">' + esc(ready(b)) + '</p>') + kv([
      ['Title', esc(b.kit.title)],
      ['Charter', C.locked ? '<span class="chip chip-ok">Locked v' + esc(C.version) + '</span>' : '<span class="chip chip-muted">Not locked</span>'],
      ['Codex', b.codex && b.codex.version ? 'v' + esc(b.codex.version) : '<span class="chip chip-muted">Not generated</span>'],
      ['Tile size', sp.tileSize ? esc(sp.tileSize) + ' px' : '-'],
      ['Resolution', res.w ? esc(res.w + ' by ' + res.h) : '-'],
      ['Palette', sp.paletteSize ? esc(sp.paletteSize) + ' colors' : '-'],
      ['Controls', esc(sp.mobileControls || '-')],
      ['Forges', esc(Object.keys(b.kit.forges || {}).map(function (f) { return f + ' ' + ((b.kit.forges[f] || {}).status || ''); }).join(', '))],
      ['Opened', esc((b.kit.opened || []).join(', ') || 'none')]
    ]);
    grid.appendChild(proj);

    var cast = el('section', 'card');
    var chs = Array.isArray(S.chapters) ? S.chapters : [];
    cast.innerHTML = '<h3 class="section-h">What art is owed</h3>' + kv([
      ['Characters', count(b, 'chr_')], ['Enemy families', count(b, 'fam_')], ['Abilities', count(b, 'abl_')],
      ['Items', count(b, 'itm_')], ['Equipment', count(b, 'eqp_')], ['Statuses', count(b, 'sta_')],
      ['Weather states', count(b, 'wth_')], ['Elements', ((C.ruleset || {}).elements || []).length],
      ['Chapters', chs.length], ['Endings', S.endings && Array.isArray(S.endings.endings) ? S.endings.endings.length : 0]
    ]);
    grid.appendChild(cast);

    var art = el('section', 'card');
    var r = b.art && b.art.records || {};
    var fw = ART.forwardRefs(b);
    art.innerHTML = '<h3 class="section-h">Art namespace</h3>' + kv([
      ['Version', esc(b.art.version)],
      ['Records', ART.PREFIXES.reduce(function (n, p) { return n + (r[p] ? Object.keys(r[p]).length : 0); }, 0)],
      ['Art opened', Kit.codex.isOpened('art') ? '<span class="chip chip-ok">yes</span>' : '<span class="chip chip-muted">no, until a Final export</span>'],
      ['Forward fields filled', fw.length + (fw.length ? ' (' + fw.filter(function (f) { return !f.ok; }).length + ' unresolved)' : '')],
      ['Master palette', ART.palette.master(b) ? ART.palette.entries(b).length + ' colors' : '<span class="chip chip-muted">not built</span>']
    ]) + '<div class="a7-prefixes">' + ART.PREFIXES.map(function (p) {
      var n = r[p] ? Object.keys(r[p]).length : 0;
      return '<span class="chip ' + (n ? 'chip-accent' : 'chip-muted') + '" title="' + esc(ART.TYPES[p].label) + '">' + esc(p) + ' ' + n + '</span>';
    }).join('') + '</div>';
    grid.appendChild(art);

    var mus = el('section', 'card');
    var roles = ART.musicRoles(b).filter(function (x) { return x.required; });
    mus.innerHTML = '<h3 class="section-h">Music roles (' + roles.length + ' required)</h3><div class="a7-prefixes">' +
      roles.map(function (x) { return '<span class="chip ' + (x.kind === 'generated' ? 'chip-accent' : 'chip-muted') + '">' + esc(x.key) + '</span>'; }).join('') + '</div>';
    grid.appendChild(mus);

    var size = el('section', 'panel');
    size.appendChild(el('h3', 'section-h', 'Size'));
    sizeBody(size);
    host.appendChild(size);
  }

  // ---------------------------------------------------------------- tabs that arrive in later phases
  var LATER = [
    ['palette', 'Palette', 'chart', 'Master palette, colorways, tier palettes, and element palettes.', 'Phase 1'],
    ['sprites', 'Sprites', 'edit', 'Parts, characters, villain and NPCs, bestiary, portraits, and the pixel editor.', 'Phase 2'],
    ['motion', 'Motion', 'spark', 'Pose library, animations, ability animations, effects, and weather overlays.', 'Phase 3'],
    ['world', 'World Art', 'arena', 'Tilesets, interiors, priority, tile animations, and backgrounds.', 'Phase 4'],
    ['interface', 'Interface', 'slots', 'Icons, window and font, cursor, touch skin, and title.', 'Phase 2 and 5'],
    ['sound', 'Sound', 'book', 'Instruments, effects, motifs, score by role, and the jukebox.', 'Phase 6'],
    ['playtest', 'Playtest', 'sword', 'Dressed battles, the test room, and the window preview.', 'Phase 5']
  ];

  function renderExport(host) {
    var b = cur(), fw = ART.forwardRefs(b);
    var p = el('section', 'panel');
    p.innerHTML = '<h2 class="panel-title">Export</h2><p class="muted">Coverage and reference checks arrive in Phase 8. Today this exports the bundle with the art namespace and a forge 147 manifest. A Draft export keeps art closed so Day 146 still reads art fields as forward references; a Final export opens art and is allowed only when every forward field resolves.</p>';
    var bt = el('button', 'btn btn-primary', Kit.icon('export') + '<span>Export</span>'); bt.type = 'button'; bt.addEventListener('click', Kit.openExport);
    p.appendChild(bt);
    host.appendChild(p);
    var f = el('section', 'panel');
    f.appendChild(el('h3', 'section-h', 'Forward fields'));
    if (!fw.length) f.appendChild(el('div', 'empty-line', 'No forward field is filled yet. Phase 7 fills portrait, leitmotif, animation, sfx, icon, and sprite fields.'));
    else {
      var t = el('table', 'tbl');
      t.innerHTML = '<thead><tr><th scope="col">Record</th><th scope="col">Field</th><th scope="col">Points at</th><th scope="col">State</th></tr></thead><tbody>' +
        fw.map(function (x) { return '<tr><td><code>' + esc(x.recordId) + '</code></td><td>' + esc(x.field) + '</td><td><code>' + esc(x.id) + '</code></td><td>' + (x.ok ? '<span class="chip chip-ok">resolves</span>' : '<span class="chip chip-broken">missing</span>') + '</td></tr>'; }).join('') + '</tbody>';
      var w = el('div', 'tbl-wrap'); w.appendChild(t); f.appendChild(w);
    }
    host.appendChild(f);
  }

  function renderDev(host) {
    var p = el('section', 'panel');
    p.innerHTML = '<h2 class="panel-title">Developer</h2><p class="muted">Fixtures are generated in code. Loading one replaces the working draft.</p>';
    var list = el('div', 'a7-fixtures');
    ART_DEMO.FIXTURES.forEach(function (fx) {
      var row = el('div', 'slot-row');
      row.appendChild(el('div', 'slot-info', '<strong>' + esc(fx.key) + '</strong><small>' + esc(fx.purpose) + '</small>'));
      var go = el('button', 'btn', '<span>Load</span>'); go.type = 'button';
      go.addEventListener('click', function () { Kit.bundle.load(ART_DEMO.fixture(fx.key)); Kit.ui.toast('Loaded fixture ' + fx.key + '.', 'ok'); });
      row.appendChild(go);
      list.appendChild(row);
    });
    p.appendChild(list);
    var out = el('div');
    var run = el('button', 'btn btn-primary', Kit.icon('check') + '<span>Run self test</span>'); run.type = 'button';
    run.addEventListener('click', function () {
      U.clear(out);
      var rows = ART_DEMO.selfTest();
      window.ART_LAST_SELFTEST = rows;
      var t = el('table', 'tbl');
      t.innerHTML = '<thead><tr><th scope="col">Fixture</th><th scope="col">Hash</th><th scope="col" class="num">Records</th><th scope="col">Validation</th><th scope="col" class="num">Roles</th><th scope="col" class="num">Size</th><th scope="col" class="num">Build ms</th><th scope="col">Quick Build</th><th scope="col">Motion</th><th scope="col">Coverage</th><th scope="col">Bake</th></tr></thead><tbody>' +
        rows.map(function (r) { var v = r.validation; return '<tr><th scope="row">' + esc(r.key) + '</th><td>' + (r.hashOk ? '<span class="chip chip-ok">ok</span>' : '<span class="chip chip-error">bad</span>') + '</td><td class="num">' + r.records + '</td><td>' + v.errors + ' err, ' + v.broken + ' broken, ' + v.forward + ' fwd</td><td class="num">' + r.roles + '</td><td class="num">' + esc(U.fmtSize(r.size)) + '</td><td class="num">' + r.buildMs + '</td><td class="muted">' + esc(r.quickBuild + (r.palette ? '; master ' + r.palette.master + '/' + r.palette.want + ', ' + r.palette.locals + ' colorways, ' + r.palette.tiers + ' tiers (' + r.palette.offset + ' shifted, ' + r.palette.collapsed + ' same), ' + r.palette.effects + ' effects' : '')) + '</td><td class="muted">' + esc(r.motion ? r.motion.anims + ' animations, ' + r.motion.abilities + ' ability, ' + r.motion.overlays + ' weather' + (r.motion.generic ? ' (' + r.motion.generic + ' generic)' : '') + '; ' + r.motion.steps + ' steps in ' + r.motion.ms + ' ms' : 'none') + '</td><td class="muted">' + esc(r.coverage) + '</td><td class="muted">' + esc(r.bakeMs + (r.bake ? ', ' + U.fmtSize(r.bake.bytes) : '')) + '</td></tr>'; }).join('') + '</tbody>';
      var w = el('div', 'tbl-wrap'); w.appendChild(t); out.appendChild(w);
    });
    p.appendChild(run); p.appendChild(out);
    host.appendChild(p);
  }

  // ---------------------------------------------------------------- mount
  Kit.mount('start', { title: 'Start', icon: 'scroll', canEnter: function () { return true; }, render: renderStart });
  // A workspace fence that has arrived registers ART.WS[key] = {render, focus}; the rest stay stubs until their phase.
  LATER.forEach(function (t) {
    var real = ART.WS && ART.WS[t[0]];
    Kit.mount(t[0], { title: t[1], icon: t[2], canEnter: ready, focus: real && real.focus,
      render: real ? real.render : function (host) { host.appendChild(Kit.ui.stub({ title: t[1], lead: t[3], status: 'Arrives in ' + t[4] + '.', icon: t[2] })); } });
  });
  Kit.mount('export', { title: 'Export', icon: 'export', canEnter: ready, render: renderExport });
  if (DEV) Kit.mount('dev', { title: 'Dev', icon: 'gear', canEnter: function () { return true; }, render: renderDev });
  ART.paintMeter = paintMeter;
  Kit.on('change', meterSoon);
  Kit.on('load', function () { paintMeter(); });
})();
// === WS:ART147 END ===
// === APP:BOOT BEGIN ===
(function () {
  'use strict';
  function wire(id, icon, label, fn) {
    var b = document.getElementById(id);
    if (!b) return;
    if (icon) b.innerHTML = Kit.icon(icon) + (label ? '<span class="lbl">' + label + '</span>' : '');
    b.addEventListener('click', fn);
  }
  Kit.theme.apply();
  try { window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () { if (Kit.theme.get() === 'system') Kit.theme.apply(); }); } catch (e) {}
  wire('btnSettings', 'gear', null, function () { Kit.settings.open(); });
  document.getElementById('btnTheme').addEventListener('click', Kit.theme.toggle);
  wire('btnTitle', null, null, Kit.renameProject);
  wire('btnValidation', null, null, Kit.openValidation);
  wire('btnSize', null, null, function () { ART.openSize(); });
  wire('btnSave', 'save', 'Save', function () { if (Kit.bundle.save()) Kit.ui.toast('Draft saved in this browser.', 'ok'); });
  wire('btnSlots', 'slots', 'Slots', Kit.openSlots);
  wire('btnImport', 'import', 'Import', function () { var f = document.getElementById('fileImport'); f.value = ''; f.click(); });
  wire('btnExport', 'export', 'Export', Kit.openExport);
  document.getElementById('btnBannerExport').addEventListener('click', Kit.openExport);
  document.getElementById('fileImport').addEventListener('change', function (e) { Kit.importPicked(e.target.files && e.target.files[0]); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      if (Kit.bundle.save()) Kit.ui.toast('Draft saved in this browser.', 'ok');
    } else if (e.key === 'Escape' && Kit.ui.overlayCount() && !Kit.ui.busy.active()) { e.preventDefault(); Kit.ui.closeTop(); }
  });
  // The draft may live in IndexedDB (see ART.storage), so restoring waits for the mirror to load. It always resolves.
  ART.booted = ART.storage.ready().then(function () {
    var b = Kit.bundle.restoreDraft() || Kit.bundle.create('Untitled Saga');
    if (ART.ensure(b) | ART.registerCodex(b)) Kit.bundle.touch('art-ensure');
    var want = Kit.uiState.get().tab;
    if (!want || !Kit.go(want, { silent: true })) Kit.go('start', { silent: true });
    ART.paintMeter();
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') Kit.bundle.suspend.save(); });
  window.addEventListener('pagehide', function () { Kit.bundle.suspend.save(); });
})();
// === APP:BOOT END ===
</script>
</body>
</html>
